spring:
  application:
    name: yangbin-ai-code-mother-backend
  session:
    store-type: redis
    timeout: 2592000
    redis:
      namespace: yangbin:code:session
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/yangbin_ai_code_mother}
    username: ${DB_USER:yangbin_code}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:}
      ttl: 3600
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8123}
  forward-headers-strategy: framework
  servlet:
    context-path: /api
    session:
      cookie:
        name: YANGBIN_CODE_SESSION
        max-age: 2592000
        http-only: true
        same-site: lax
springdoc:
  group-configs:
    - group: default
      paths-to-match: '/**'
      packages-to-scan: com.yangbin.yangbinaicodemother.controller
knife4j:
  enable: ${API_DOCS_ENABLED:false}
langchain4j:
  open-ai:
    chat-model:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:unconfigured}
      model-name: ${AI_MODEL:deepseek-chat}
      max-tokens: 8192
      log-requests: false
      log-responses: false
      max-retries: 2
    streaming-chat-model:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:unconfigured}
      model-name: ${AI_MODEL:deepseek-chat}
      max-tokens: 8192
      log-requests: false
      log-responses: false
    reasoning-streaming-chat-model:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:unconfigured}
      model-name: ${AI_REASONING_MODEL:${AI_MODEL:deepseek-chat}}
      max-tokens: 16384
      temperature: 0.1
      log-requests: false
      log-responses: false
    routing-chat-model:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:unconfigured}
      model-name: ${AI_ROUTING_MODEL:${AI_MODEL:deepseek-chat}}
      max-tokens: 100
      log-requests: false
      log-responses: false
cos:
  client:
    host: ${COS_HOST:}
    secretId: ${COS_SECRET_ID:unconfigured}
    secretKey: ${COS_SECRET_KEY:unconfigured}
    region: ${COS_REGION:ap-shanghai}
    bucket: ${COS_BUCKET:unconfigured}
storage:
  type: ${STORAGE_TYPE:local}
pexels:
  api-key: ${PEXELS_API_KEY:}
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  image-model: wan2.2-t2i-flash
code:
  deploy-host: ${DEPLOY_HOST:http://127.0.0.1:18824/dist}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
